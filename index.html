<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>baryshpol.sys — панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

<!-- =====================================================================
     baryshpol.sys — Telegram Mini App / візитка-резюме
     Концепція: особистий "пульт керування" AI-інтегратора.
     ЩОБ РЕДАГУВАТИ — зміни лише об'єкт CONFIG внизу (у <script>).
     Контакти вже заповнені з твого CV — перевір і, за потреби, поправ.
     Лінк на CV(PDF) працює лише якщо документ відкрито "всім за посиланням".
     ===================================================================== -->
<style>
  :root{
    --bg:#0b0b10; --panel:#131320; --panel2:#0f0f18;
    --line:#22222f; --line2:#2c2c3d;
    --ink:#0b0b10;
    --violet:#7b5cff; --violet-d:#3d1fd6;
    --orange:#ff6a2b; --pink:#ff7ac2;
    --lime:#b6ff2e;
    --txt:#ececf3; --muted:#7a7a8c; --dim:#4a4a5c;
  }
  :root{ --app-vh:100vh; --tg-top:0px; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:#000;color:var(--txt);
    font-family:'JetBrains Mono',monospace;font-size:14px;
    overscroll-behavior:none;-webkit-font-smoothing:antialiased;
    position:fixed;inset:0;width:100%;
  }
  /* Висота рахується JS-ом у px (надійно у Telegram in-app браузері,
     де dvh часто не підтримується) — 100vh/100dvh лишаються запасним варіантом. */
  #app{
    position:fixed;inset:0;margin:0 auto;
    width:100%;max-width:460px;
    height:100vh;height:100dvh;height:var(--app-vh);
    background:var(--bg);overflow:hidden;
    background-image:
      radial-gradient(120% 80% at 100% 0%, rgba(123,92,255,.14), transparent 55%),
      radial-gradient(120% 70% at 0% 100%, rgba(255,106,43,.10), transparent 55%);
  }
  /* тонкі скан-лінії — атмосфера консолі */
  #app::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:60;opacity:.35;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  }

  /* ═══════════ DESKTOP-РЕЖИМ ═══════════
     На великих екранах застосунок паковано як "фрейм телефону" по центру,
     а зліва — постійна панель швидкої навігації (не потрібно тиснути "назад"). */
  .desk-side{display:none}
  @media (min-width:860px){
    html,body{overflow:auto}
    body{
      position:static;inset:auto;width:auto;
      display:flex;align-items:center;justify-content:center;gap:36px;
      min-height:100vh;padding:40px;
      background:
        radial-gradient(1100px 650px at 12% 8%, rgba(123,92,255,.16), transparent 60%),
        radial-gradient(950px 650px at 88% 92%, rgba(255,106,43,.12), transparent 60%),
        #050507;
    }
    #app{
      position:relative;inset:auto;margin:0;flex:none;
      width:420px;max-width:420px;height:min(860px,88vh);
      border-radius:26px;
      box-shadow:0 40px 100px rgba(0,0,0,.6), 0 0 0 1px var(--line2);
    }
    .desk-side{
      display:flex;flex-direction:column;gap:20px;
      width:250px;flex:none;align-self:center;max-height:min(860px,88vh);
      background:linear-gradient(180deg,var(--panel),var(--panel2));
      border:1px solid var(--line2);border-radius:22px;padding:26px 22px;
      overflow-y:auto;
    }
    .desk-name{font-family:'Unbounded',sans-serif;font-weight:900;font-size:21px;line-height:1.08;
      background:linear-gradient(96deg,var(--violet),var(--pink) 45%,var(--orange));
      -webkit-background-clip:text;background-clip:text;color:transparent}
    .desk-role{margin-top:9px;font-size:11px;color:var(--muted);letter-spacing:.05em;line-height:1.5}
    .desk-nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
    .desk-item{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;
      color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.04em;
      padding:10px 11px;border-radius:9px;cursor:pointer;text-align:left;width:100%}
    .desk-item span{color:var(--dim);font-size:10px;letter-spacing:.1em;min-width:16px}
    .desk-item:hover{background:rgba(255,255,255,.045)}
    .desk-item.active{background:rgba(123,92,255,.16);border-color:var(--violet);color:#fff}
    .desk-item.active span{color:var(--lime)}
    .desk-cv{margin-top:auto;display:block;text-align:center;font-size:11px;letter-spacing:.06em;
      padding:11px;border-radius:9px;border:1px solid var(--lime);color:var(--lime);text-decoration:none}
    .desk-cv:hover{background:rgba(182,255,46,.08)}
    .desk-status{font-size:9.5px;letter-spacing:.09em;color:var(--muted);display:flex;align-items:center;gap:6px}
    .desk-status i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 6px var(--lime);flex:none}
  }

  .cur{display:inline-block;width:9px;height:1.05em;background:var(--lime);
    vertical-align:-2px;margin-left:3px;animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ─────────── БУТ-ЕКРАН ─────────── */
  #boot{position:absolute;inset:0;z-index:80;background:var(--bg);
    display:flex;flex-direction:column;justify-content:center;
    padding:calc(26px + var(--tg-top)) 26px 26px;gap:6px;
    font-size:13px;color:var(--muted);cursor:pointer}
  #boot .l{opacity:0}
  #boot .l.on{opacity:1}
  #boot .ok{color:var(--lime)}
  #boot .hl{color:var(--txt)}
  #boot .skip{position:absolute;bottom:22px;left:0;right:0;text-align:center;
    font-size:10px;letter-spacing:.2em;color:var(--dim)}

  /* ─────────── ЕКРАНИ ─────────── */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease}
  .screen.active{opacity:1;visibility:visible;pointer-events:auto}
  .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .scroll::-webkit-scrollbar{width:0}

  /* верхня системна стрічка (+ запас під нативну шапку Telegram: заголовок / кнопки) */
  .sysbar{display:flex;align-items:center;gap:8px;
    padding:calc(11px + var(--tg-top)) 16px 11px;
    border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;color:var(--muted)}
  .led{width:8px;height:8px;border-radius:50%;background:var(--lime);
    box-shadow:0 0 8px var(--lime);animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35;box-shadow:none}}
  .sysbar .sp{margin-left:auto;color:var(--dim)}
  .lang{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;flex:none}
  .lang button{background:transparent;border:0;color:var(--muted);font-family:inherit;
    font-size:10px;letter-spacing:.1em;font-weight:700;padding:5px 8px;cursor:pointer}
  .lang button.on{background:var(--violet);color:#fff}
  .nav .lang{margin-left:auto;margin-right:10px}

  /* кнопка НАЗАД (видима на кожному внутрішньому екрані) */
  .nav{display:flex;align-items:center;justify-content:space-between;
    padding:calc(12px + var(--tg-top)) 14px 12px;
    border-bottom:1px solid var(--line);background:var(--panel2)}
  .back{display:inline-flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--line2);color:var(--txt);
    font-family:inherit;font-size:12px;letter-spacing:.08em;font-weight:700;
    padding:9px 14px;border-radius:8px;cursor:pointer;transition:.12s}
  .back:hover{border-color:var(--violet);color:#fff}
  .back:active{transform:translateX(-2px)}
  .nav .tag{font-size:11px;letter-spacing:.18em;color:var(--muted)}
  .nav .tag b{color:var(--lime)}

  /* ─────────── ГОЛОВНА (home) ─────────── */
  .hero{padding:26px 20px 12px}
  .kicker{font-size:11px;letter-spacing:.22em;color:var(--muted);margin-bottom:14px}
  .kicker b{color:var(--orange)}
  .name1,.name2{white-space:nowrap}
  /* background-clip:text може зрізати край останньої літери — лишаємо запас */
  .name2{padding-right:3px}
  .name1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(30px,9vw,42px);
    line-height:.98;letter-spacing:-.01em;color:var(--txt)}
  .name2{font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(30px,10.5vw,52px);
    line-height:.9;letter-spacing:-.02em;
    background:linear-gradient(96deg,var(--violet),var(--pink) 45%,var(--orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-top:2px}
  .role{margin-top:14px;font-size:13px;color:var(--txt);letter-spacing:.02em}
  .role .d{color:var(--dim);margin:0 6px}
  .loc{margin-top:9px;font-size:12px;color:var(--muted);line-height:1.6}
  .loc .g{color:var(--lime)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .chip{font-size:11px;letter-spacing:.04em;padding:6px 10px;border-radius:20px;
    border:1px solid var(--line2);color:#c7c7d4;background:rgba(255,255,255,.02)}
  .chip.hot{border-color:var(--lime);color:var(--lime);background:rgba(182,255,46,.06)}

  .prompt{padding:20px 20px 8px;font-size:11px;letter-spacing:.14em;color:var(--muted)}
  .prompt .p{color:var(--violet)}

  .menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 16px 8px}
  .mod{position:relative;border:1px solid var(--line2);border-radius:12px;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    padding:16px 14px;min-height:96px;cursor:pointer;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;transition:.14s}
  .mod:hover{border-color:var(--violet)}
  .mod:active{transform:scale(.975)}
  .mod .no{font-size:10px;letter-spacing:.16em;color:var(--dim)}
  .mod .nm{font-family:'Unbounded',sans-serif;font-weight:700;font-size:18px;line-height:1;margin-top:auto}
  .mod .ar{position:absolute;top:14px;right:14px;color:var(--muted);font-size:14px}
  .mod.hire{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;
    justify-content:space-between;border-color:transparent;
    background:linear-gradient(96deg,var(--violet-d),var(--violet) 60%,var(--orange))}
  .mod.hire .nm{margin:0;color:#fff}
  .mod.hire .sub{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.85)}
  .mod.hire .ar{color:#fff}

  .sched{margin:12px 16px 22px;border:1px dashed var(--line2);border-radius:10px;
    padding:11px 14px;overflow:hidden;white-space:nowrap}
  .sched .tick{display:inline-block;font-size:11px;letter-spacing:.08em;color:var(--muted);
    animation:slide 22s linear infinite}
  .sched b{color:var(--lime)}.sched i{color:var(--orange);font-style:normal}
  @keyframes slide{from{transform:translateX(20px)}to{transform:translateX(-100%)}}

  /* ─────────── заголовки внутрішніх ─────────── */
  .head{padding:22px 20px 8px}
  .head h2{font-family:'Unbounded',sans-serif;font-weight:900;font-size:34px;line-height:.92;letter-spacing:-.01em}
  .head .sub{margin-top:8px;font-size:12px;color:var(--muted);letter-spacing:.02em}
  .head.violet h2{color:var(--violet)}.head.orange h2{color:var(--orange)}
  .head.pink h2{color:var(--pink)}.head.lime h2{color:var(--lime)}
  .body{padding:8px 20px 30px}

  /* СТЕК */
  .grp{margin-top:20px}
  .grp:first-child{margin-top:6px}
  .grp .gt{font-size:11px;letter-spacing:.16em;color:var(--muted);margin-bottom:10px;
    display:flex;align-items:center;gap:10px}
  .grp .gt::after{content:"";flex:1;height:1px;background:var(--line)}
  .tags{display:flex;flex-wrap:wrap;gap:7px}
  .tg{font-size:12.5px;padding:7px 11px;border:1px solid var(--line2);border-radius:7px;
    background:var(--panel2);color:#dcdce6}
  .tg.k{border-color:var(--violet);color:#cfc4ff}

  /* ПРОЄКТИ (сервіси) */
  .svc{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);
    margin-bottom:12px;overflow:hidden}
  .svc .top{display:flex;align-items:flex-start;gap:12px;padding:16px;cursor:pointer}
  .svc .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
  .dot.live{background:var(--lime);box-shadow:0 0 8px var(--lime)}
  .dot.sub{background:var(--violet);box-shadow:0 0 8px var(--violet)}
  .dot.dev{background:var(--orange);box-shadow:0 0 8px var(--orange)}
  .svc .mid{flex:1;min-width:0}
  .svc .sn{font-family:'Unbounded',sans-serif;font-weight:700;font-size:19px;line-height:1}
  .svc .sd{margin-top:7px;font-size:12.5px;color:#c2c2d0;line-height:1.5}
  .svc .stt{font-size:9.5px;letter-spacing:.12em;padding:5px 8px;border-radius:20px;flex:none;font-weight:700}
  .stt.live{background:rgba(182,255,46,.12);color:var(--lime)}
  .stt.sub{background:rgba(123,92,255,.15);color:#c4b6ff}
  .stt.dev{background:rgba(255,106,43,.13);color:var(--orange)}
  .svc .exp{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .svc.open .exp{max-height:340px}
  .svc .expi{padding:0 16px 16px;border-top:1px solid var(--line);margin-top:2px;padding-top:14px}
  .svc ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .svc li{font-size:12.5px;color:#c8c8d4;line-height:1.45;padding-left:16px;position:relative}
  .svc li::before{content:"›";position:absolute;left:0;color:var(--violet);font-weight:700}
  .svc .tech{margin-top:12px;font-size:11px;letter-spacing:.04em;color:var(--lime)}
  .svc .chev{color:var(--muted);font-size:12px;transition:transform .25s;margin-top:4px}
  .svc.open .chev{transform:rotate(90deg)}

  /* ДОСВІД */
  .xp{position:relative;padding:0 0 22px 20px;border-left:1px solid var(--line2)}
  .xp:last-child{border-color:transparent;padding-bottom:4px}
  .xp::before{content:"";position:absolute;left:-5px;top:2px;width:10px;height:10px;
    border-radius:50%;background:var(--bg);border:2px solid var(--violet)}
  .xp .yr{font-size:11px;letter-spacing:.1em;color:var(--orange)}
  .xp .ti{font-family:'Unbounded',sans-serif;font-weight:700;font-size:16px;margin:5px 0 2px}
  .xp .co{font-size:12px;color:var(--muted);margin-bottom:8px}
  .xp ul{list-style:none;display:flex;flex-direction:column;gap:6px}
  .xp li{font-size:12.5px;color:#c2c2d0;line-height:1.45;padding-left:15px;position:relative}
  .xp li::before{content:"–";position:absolute;left:0;color:var(--dim)}

  /* КОНТАКТ */
  .row{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--txt);
    padding:17px 6px;border-bottom:1px solid var(--line);transition:.12s}
  .row:hover{padding-left:12px}
  .row .rk{flex:0 0 84px;font-size:11px;letter-spacing:.1em;color:var(--muted)}
  .row .rv{flex:1;font-size:14px;color:var(--txt);word-break:break-all}
  .row .ra{color:var(--muted)}
  .row.cta{border:1px solid var(--lime);border-radius:10px;margin:16px 0 6px;padding:16px;
    background:rgba(182,255,46,.06)}
  .row.cta .rk,.row.cta .rv{color:var(--lime)}.row.cta .ra{color:var(--lime)}
  .foot{padding:24px 4px 34px;color:var(--dim);font-size:10.5px;letter-spacing:.08em;line-height:2}
  .foot .g{color:var(--lime)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
    #boot .l{opacity:1}.sched .tick{animation:none}}
</style>
</head>
<body>
<div id="app">

  <!-- БУТ -->
  <div id="boot">
    <div class="l" id="b0">&gt; init <span class="hl">baryshpol.sys</span></div>
    <div class="l" id="b1">&gt; <span data-i18n="boot1"></span>: python · aiogram · supabase <span class="ok">ok</span></div>
    <div class="l" id="b2">&gt; <span data-i18n="boot2"></span>: <span class="hl">4 online</span></div>
    <div class="l" id="b3">&gt; <span data-i18n="boot3"></span>: <span class="ok">OPEN_TO_WORK</span></div>
    <div class="l" id="b4">&gt; <span data-i18n="boot4"></span><span class="cur"></span></div>
    <div class="skip" data-i18n="bootSkip"></div>
  </div>

  <!-- ГОЛОВНА -->
  <section class="screen" id="s-home">
    <div class="sysbar"><span class="led"></span><span>baryshpol.sys</span>
      <span class="sp" id="clk">--:--</span>
      <span class="lang" style="margin-left:10px">
        <button data-lang="ua">UA</button><button data-lang="en">EN</button></span></div>
    <div class="scroll">
      <div class="hero">
        <div class="kicker">// <span data-i18n="kicker"></span> · <b data-i18n="kickerB"></b></div>
        <div class="name1" id="h-n1">ДМИТРО</div>
        <div class="name2" id="h-n2">БАРИШПОЛЬ</div>
        <div class="role" id="h-role"></div>
        <div class="loc" id="h-loc"></div>
        <div class="chips" id="h-chips"></div>
      </div>

      <div class="prompt"><span class="p">dmytro@sys</span>:~$ <span data-i18n="choose"></span></div>
      <div class="menu">
        <div class="mod" data-go="profile"><span class="ar">↗</span><div class="no">01</div><div class="nm" data-i18n="mProfile"></div></div>
        <div class="mod" data-go="stack"><span class="ar">↗</span><div class="no">02</div><div class="nm" data-i18n="mStack"></div></div>
        <div class="mod" data-go="projects"><span class="ar">↗</span><div class="no">03</div><div class="nm" data-i18n="mProjects"></div></div>
        <div class="mod" data-go="experience"><span class="ar">↗</span><div class="no">04</div><div class="nm" data-i18n="mExp"></div></div>
        <div class="mod hire" data-go="contact"><div><div class="nm">05 · <span data-i18n="mContact"></span></div><div class="sub" data-i18n="mContactSub"></div></div><span class="ar">↗</span></div>
      </div>

      <div class="sched"><span class="tick" id="tick"></span></div>
    </div>
  </section>

  <!-- ПРОФІЛЬ -->
  <section class="screen" id="s-profile">
    <div class="nav"><button class="back">← <span data-i18n="back"></span></button><span class="lang"><button data-lang="ua">UA</button><button data-lang="en">EN</button></span><span class="tag"><span data-i18n="module"></span> <b>01</b> / <span data-i18n="tagProfile"></span></span></div>
    <div class="scroll">
      <div class="head violet"><h2 data-i18n="hProfile"></h2><div class="sub" data-i18n="sProfile"></div></div>
      <div class="body" id="profile-body"></div>
    </div>
  </section>

  <!-- СТЕК -->
  <section class="screen" id="s-stack">
    <div class="nav"><button class="back">← <span data-i18n="back"></span></button><span class="lang"><button data-lang="ua">UA</button><button data-lang="en">EN</button></span><span class="tag"><span data-i18n="module"></span> <b>02</b> / <span data-i18n="tagStack"></span></span></div>
    <div class="scroll">
      <div class="head lime"><h2 data-i18n="hStack"></h2><div class="sub" id="stack-sub"></div></div>
      <div class="body" id="stack-body"></div>
    </div>
  </section>

  <!-- ПРОЄКТИ -->
  <section class="screen" id="s-projects">
    <div class="nav"><button class="back">← <span data-i18n="back"></span></button><span class="lang"><button data-lang="ua">UA</button><button data-lang="en">EN</button></span><span class="tag"><span data-i18n="module"></span> <b>03</b> / <span data-i18n="tagProjects"></span></span></div>
    <div class="scroll">
      <div class="head orange"><h2 data-i18n="hProjects"></h2><div class="sub" data-i18n="sProjects"></div></div>
      <div class="body" id="projects-body"></div>
    </div>
  </section>

  <!-- ДОСВІД -->
  <section class="screen" id="s-experience">

/* ── Реальна висота екрана + відступ під нативну шапку Telegram ──
   Telegram's in-app WebView не завжди підтримує dvh коректно, тому
   рахуємо px вручну і оновлюємо на кожну зміну viewport. */
function fitViewport(){
  const h = (tg && tg.viewportStableHeight) || window.visualViewport?.height || window.innerHeight;
  document.documentElement.style.setProperty('--app-vh', h + 'px');

  let top = 0;
  if (tg && tg.contentSafeAreaInset && typeof tg.contentSafeAreaInset.top === 'number') {
    top = tg.contentSafeAreaInset.top;
  } else if (tg && tg.safeAreaInset && typeof tg.safeAreaInset.top === 'number') {
    top = tg.safeAreaInset.top;
  }
  // запас під заголовок/кнопки Telegram (Закрыть · назва · ⌄ · •••),
  // якщо API не віддав точне значення
  if (top < 4 && tg) top = 58;
  document.documentElement.style.setProperty('--tg-top', top + 'px');
}
fitViewport();
window.addEventListener('resize', fitViewport);
window.visualViewport && window.visualViewport.addEventListener('resize', fitViewport);
if (tg && tg.onEvent) { tg.onEvent('viewportChanged', fitViewport); tg.onEvent('safeAreaChanged', fitViewport); tg.onEvent('contentSafeAreaChanged', fitViewport); }

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));

  document.querySelectorAll('.desk-item').forEach(b=>b.classList.toggle('active', b.dataset.go===id));
}
function go(id){ if(id===stack[stack.length-1])return; stack.push(id); show(id);
  if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light'); }
function back(){ if(stack.length>1){ stack.pop(); show(stack[stack.length-1]);
  if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('soft'); } }
if(tg) tg.BackButton.onClick(back);

document.addEventListener('click',e=>{
  if(e.target.closest('.back')){ back(); return; }

  const s=e.target.closest('.svc .top'); if(s){ s.parentElement.classList.toggle('open'); }
});

  fitName();
}

/* ── прізвище на всю ширину екрана ──
   На відміну від "не вилазити за край", тут ціль — точно заповнити
   доступну ширину: масштабуємо кегль і вгору, і вниз. Ім'я лишається
   пропорційно меншим (класична афішна ієрархія: маленьке зверху, велике знизу). */
function fitOne(sel, avail, mode){
  const n = $(sel); if(!n || avail<=0) return;
  n.style.fontSize = '';
  const probe = 200;                       // еталонний кегль для виміру
  n.style.fontSize = probe+'px';
  const w = n.scrollWidth;
  n.style.fontSize = '';
  if(w<=0) return;
  let target = avail / w * probe;
  if(mode==='shrink'){
    const base = parseFloat(getComputedStyle(n).fontSize);
    target = Math.min(base, target);        // не збільшуємо понад базовий CSS-кегль
  }
  target = Math.max(target, 16);
  n.style.fontSize = target + 'px';
}
function fitName(){
  const n1 = $('#h-n1'); if(!n1) return;
  const p = n1.parentElement, ps = getComputedStyle(p);
  const avail = p.clientWidth
              - parseFloat(ps.paddingLeft) - parseFloat(ps.paddingRight)
              - 4;
  fitOne('#h-n1', avail, 'shrink');   // ім'я: не вилазить за край
  fitOne('#h-n2', avail, 'fill');     // прізвище: рівно на всю ширину
}
window.addEventListener('resize', fitName);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitName);

/* перемикання мови */
function setLang(l){
  if(l===LANG || !UI[l]) return;
  LANG=l; render();
  if(tg&&tg.HapticFeedback) tg.HapticFeedback.selectionChanged&&tg.HapticFeedback.selectionChanged();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.lang button'); if(b){ e.stopPropagation(); setLang(b.dataset.lang); }
});

render();

/* годинник */
function clock(){const d=new Date();$('#clk').textContent=
  String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
clock(); setInterval(clock,10000);

/* бут-послідовність */
const boot=$('#boot');
function endBoot(){ if(!boot)return; boot.style.transition='opacity .3s'; boot.style.opacity='0';
  setTimeout(()=>{boot.style.display='none';},300); show('home'); }
if(reduce){ ['b0','b1','b2','b3','b4'].forEach(i=>$('#'+i).classList.add('on')); show('home');
  setTimeout(endBoot,600); }
else{
  const ids=['b0','b1','b2','b3','b4'];
  ids.forEach((id,i)=>setTimeout(()=>$('#'+id).classList.add('on'), 220*i+120));
  setTimeout(endBoot, 220*ids.length+700);
}
boot.addEventListener('click',endBoot);
</script>
